name: Flutter Production Release on Merge to Master

on:
  pull_request:
    types: [ closed ]
    branches:
      - master

jobs:
  build_and_release_prod:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 🧩 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🐦 Setup Flutter (latest stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          flutter clean

      # 🏗️ Build Production Split APKs
      - name: Build Flutter release APK
        run: flutter build apk --release --split-per-abi

      # 🏗️ Build Production AAB
      - name: Build Flutter release AAB
        run: flutter build appbundle --release

      # 📂 Rename files to file_hub format
      - name: Rename Artifacts
        run: |
          # Rename APKs
          cd build/app/outputs/flutter-apk/
          mv app-armeabi-v7a-release.apk file-hub-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk file-hub-arm64-v8a.apk
          mv app-x86_64-release.apk file-hub-x86_64.apk
          
          # Rename AAB
          cd ../bundle/release/
          mv app-release.aab file-hub-release.aab
          echo "✅ Files renamed to file_hub format"

      # 🏷️ Bump version (Minor bump for Master: v1.0.0 -> v1.1.0)
      - name: Bump version and create new tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: master
          default_bump: minor
          tag_prefix: "v"

      # 📝 Extract "Release Note:" from PR Description
      - name: Extract Release Notes
        id: pr_notes
        run: |
          BODY="${{ github.event.pull_request.body }}"
          # Extracts everything after 'Release Note:'
          NOTES=$(echo "$BODY" | perl -0777 -ne 'print $1 if /(?i)Release Note:\s*(.*)/s')

          if [ -z "$NOTES" ]; then NOTES="Production release stability improvements."; fi

          {
            echo "### Release Note:"
            echo "$NOTES"
            echo ""
            echo "---"
            echo "👤 Released by **${{ github.actor }}**"
          } > release_notes.md

      # 🚀 Create Production GitHub Release
      - name: Create GitHub Release
        uses: Wandalen/wretry.action@v3
        with:
          action: softprops/action-gh-release@v3
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            tag_name: ${{ steps.tag.outputs.new_tag }}
            name: "🚀 Production Release ${{ steps.tag.outputs.new_tag }}"
            generate_release_notes: true
            body_path: release_notes.md
            files: |
              build/app/outputs/flutter-apk/file-hub-armeabi-v7a.apk
              build/app/outputs/flutter-apk/file-hub-arm64-v8a.apk
              build/app/outputs/flutter-apk/file-hub-x86_64.apk
              build/app/outputs/bundle/release/file-hub-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧾 Summary
      - name: Print summary
        run: |
          echo "✅ Production release created successfully!"
          echo "🏷️ Tag: ${{ steps.tag.outputs.new_tag }}"
          echo "👤 Released by: ${{ github.actor }}"
