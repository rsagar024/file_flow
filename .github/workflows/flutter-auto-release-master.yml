name: Flutter Production Release on Merge to Master

on:
  pull_request:
    types: [ closed ]
    branches:
      - master

jobs:
  build_and_release_prod:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🐦 Setup Flutter (latest stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: latest

      # 📦 Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🧹 Clean build artifacts
      - name: Flutter clean
        run: flutter clean

      # 🏗️ Build production APK
      - name: Build Flutter release APK
        run: flutter build apk --release

      # 🏗️ Build production AAB
      - name: Build Flutter release AAB
        run: flutter build appbundle --release

      # 🏷️ Bump version for production release (minor bump)
      - name: Bump version and create new tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: master
          default_bump: minor      # master => minor bump (v1.0.0 → v1.1.0)
          tag_prefix: "v"

      # 📢 Create GitHub Release with APK and AAB
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "🚀 Production Release ${{ steps.tag.outputs.new_tag }}"
          body: |
            ## What's Changed
            ${{ steps.tag.outputs.changelog }}

            **Full Changelog:** [${{ steps.tag.outputs.previous_tag }}...${{ steps.tag.outputs.new_tag }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.tag.outputs.previous_tag }}...${{ steps.tag.outputs.new_tag }})

            👤 Released by **${{ github.actor }}**
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧾 Summary
      - name: Print summary
        run: |
          echo "✅ Production release created successfully!"
          echo "🏷️ Tag: ${{ steps.tag.outputs.new_tag }}"
          echo "📦 Uploaded files:"
          echo "   • build/app/outputs/flutter-apk/app-release.apk"
          echo "   • build/app/outputs/bundle/release/app-release.aab"
          echo "👤 Released by: ${{ github.actor }}"