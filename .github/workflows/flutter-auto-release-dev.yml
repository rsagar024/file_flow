name: Flutter Dev Release on Merge to Development

on:
  pull_request:
    types: [ closed ]
    branches:
      - development

jobs:
  build_and_release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 🧩 Checkout repo with full history for tagging
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🐦 Setup Flutter (latest stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: latest

      # 📦 Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🏗️ Build Split APKs
      - name: Build Flutter release APK
        run: flutter build apk --release --split-per-abi

      # 📂 Rename files to your specific format
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-armeabi-v7a-release.apk file-hub-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk file-hub-arm64-v8a.apk
          mv app-x86_64-release.apk file-hub-x86_64.apk

      # 🔢 Auto-increment tag (e.g., v1.0.5-dev)
      - name: Bump version and create new tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: development
          default_bump: patch
          tag_prefix: "v"
          append_to_tag: "dev"

      # 📝 Extract your custom notes from the PR description
      - name: Extract Release Notes
        id: pr_notes
        run: |
          BODY="${{ github.event.pull_request.body }}"
          # This grabs everything after "Release Note:"
          NOTES=$(echo "$BODY" | perl -0777 -ne 'print $1 if /(?i)Release Note:\s*(.*)/s')
          if [ -z "$NOTES" ]; then NOTES="No custom notes provided."; fi
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 📰 Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Dev ${{ steps.tag.outputs.new_tag }}

          # 👇 THIS IS THE "CODE" THAT SHOWS WHAT'S CHANGED LOGS
          generate_release_notes: true

          # This puts your custom notes above the auto-generated log
          body: |
            ### Release Note:
            ${{ steps.pr_notes.outputs.release_notes }}
            
            ---
          files: |
            build/app/outputs/flutter-apk/file_hub-armeabi-v7a.apk
            build/app/outputs/flutter-apk/file_hub-arm64-v8a.apk
            build/app/outputs/flutter-apk/file_hub-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}