name: Flutter Dev Release on Merge to Development

on:
  pull_request:
    types: [ closed ]
    branches:
      - development

jobs:
  build_and_release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout repo with full history for tagging
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🐦 Setup Flutter (latest stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 📦 Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🏗️ Build release APK
      - name: Build Flutter release APK
        run: flutter build apk --release

      # 🏷️ If no tag exists, create the first tag (v1.0.0)
      - name: Ensure initial tag exists
        run: |
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "⚙️ No tags found. Creating v1.0.0 as the first release..."
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor }}@users.noreply.github.com"
            git tag v1.0.0
            git push origin v1.0.0
          else
            echo "✅ Existing tags found. Proceeding..."
          fi

      # 🔢 Auto bump version and create next tag
      - name: Bump version and create new tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: development
          default_bump: patch     # You can change to minor or major if needed
          tag_prefix: "v"         # Creates tags like v1.0.1, v1.0.2, etc.

      # 📰 Create GitHub Release with changelog and APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: |
            ## What's Changed
            ${{ steps.tag.outputs.changelog }}
            **Full Changelog:** [${{ steps.tag.outputs.previous_tag }}...${{ steps.tag.outputs.new_tag }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.tag.outputs.previous_tag }}...${{ steps.tag.outputs.new_tag }})
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧾 Summary
      - name: Print summary
        run: |
          echo "✅ New release created by: ${{ github.actor }}"
          echo "🏷️ Tag: ${{ steps.tag.outputs.new_tag }}"
          echo "📦 APK attached to the release."
